<section class="s-check" data-section="Fechamento" data-menu-title="Checklist da estação">
  <header class="slide-head compact">
    <p class="eyebrow">Na estação de prática</p>
    <h2>Checklist: um examina, o outro acompanha; depois trocam</h2>
  </header>
  <form class="checklist fill" data-component="checklist" onsubmit="return false">
    <fieldset>
      <legend>Preparo, inspeção e palpação</legend>
      <label><input type="checkbox">Higieniza as mãos, apresenta-se, explica e pede permissão</label>
      <label><input type="checkbox">Expõe o tórax com privacidade; paciente sentado</label>
      <label><input type="checkbox">Inspeciona forma, simetria, abaulamentos e retrações, de frente, de costas e de perfil</label>
      <label><input type="checkbox">Conta a frequência respiratória sem avisar e descreve ritmo, amplitude e esforço</label>
      <label><input type="checkbox">Procura baqueteamento digital e cianose</label>
      <label><input type="checkbox">Testa a expansibilidade dos ápices e das bases</label>
      <label><input type="checkbox">Pesquisa o frêmito toracovocal em pontos simétricos com “trinta e três”</label>
    </fieldset>
    <fieldset>
      <legend>Percussão, ausculta e registro</legend>
      <label><input type="checkbox">Percute com a técnica dígito-digital, de cima para baixo, comparando os lados</label>
      <label><input type="checkbox">Percute as faces posterior, lateral e anterior</label>
      <label><input type="checkbox">Ausculta com o diafragma sobre a pele, paciente respirando pela boca</label>
      <label><input type="checkbox">Segue a sequência em zigue-zague, um ciclo completo por ponto</label>
      <label><input type="checkbox">Identifica o som normal antes de procurar ruídos adventícios</label>
      <label><input type="checkbox">Pede para tossir quando ouve estertores e reausculta</label>
      <label><input type="checkbox">Pesquisa a ressonância vocal, falada e sussurrada</label>
      <label><input type="checkbox">Registra o exame do normal ao alterado, com lado, região e fase</label>
    </fieldset>
    <div class="ck-bar"><span class="ck-count"></span><span class="ck-prog" aria-hidden="true"></span><button type="button" class="btn ghost ck-reset">Limpar</button></div>
  </form>
  <aside class="notes">As marcações não são salvas: servem para a dupla acompanhar a execução. (1 min)</aside>
</section>
